services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: siheung
      POSTGRES_USER: siheung
      POSTGRES_PASSWORD: siheung_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siheung -d siheung"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    container_name: siheung-backend-0301
    image: siheung-backend:0.3.1
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - ./apps/backend/.env
    command:
      [
        "sh",
        "-c",
        "./node_modules/.bin/prisma migrate deploy --schema apps/backend/prisma/schema.prisma && node apps/backend/dist/index.js"
      ]
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://siheung:siheung_dev@postgres:5432/siheung?schema=public
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: "true"
      OPENSEARCH_ENABLED: "true"
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: request-events-v1
      OPENSEARCH_TIMEOUT_MS: ${OPENSEARCH_TIMEOUT_MS:-5000}
      SEARCH_OUTBOX_INTERVAL_MS: ${SEARCH_OUTBOX_INTERVAL_MS:-5000}
      ZAP_ENABLED: "true"
      ZAP_API_URL: http://zap:8080
      ZAP_API_KEY: ${ZAP_API_KEY:-local-zap-api-key-change-this}
      ZAP_TARGET_URL: http://waf:8080/demo-shop
      ZAP_SCAN_TIMEOUT_MS: ${ZAP_SCAN_TIMEOUT_MS:-600000}
      SERVICE_CONNECTION_ALLOW_PRIVATE: "true"
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-this-value}
      HMAC_SECRET: ${HMAC_SECRET:-local-compose-hmac-secret-change-this-value}
      TELEMETRY_TOKEN: ${TELEMETRY_TOKEN:-local-compose-telemetry-service-token}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-demo1234}
      CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-3600000}
      WAF_RULE_DIR: /app/var/waf-rules
      WAF_RELOAD_TIMEOUT_MS: ${WAF_RELOAD_TIMEOUT_MS:-15000}
    ports:
      - "4000:4000"
    volumes:
      - ./waf/rules:/app/var/waf-rules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    container_name: siheung-worker-0301
    image: siheung-backend:0.3.1
    platform: linux/amd64
    command: ["node", "apps/backend/dist/worker.js"]
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://siheung:siheung_dev@postgres:5432/siheung?schema=public
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: "true"
      OPENSEARCH_ENABLED: "true"
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: request-events-v1
      OPENSEARCH_TIMEOUT_MS: ${OPENSEARCH_TIMEOUT_MS:-5000}
      SEARCH_OUTBOX_INTERVAL_MS: ${SEARCH_OUTBOX_INTERVAL_MS:-5000}
      ZAP_ENABLED: "true"
      ZAP_API_URL: http://zap:8080
      ZAP_API_KEY: ${ZAP_API_KEY:-local-zap-api-key-change-this}
      ZAP_TARGET_URL: http://waf:8080/demo-shop
      ZAP_SCAN_TIMEOUT_MS: ${ZAP_SCAN_TIMEOUT_MS:-600000}
      SERVICE_CONNECTION_ALLOW_PRIVATE: "true"
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-this-value}
      HMAC_SECRET: ${HMAC_SECRET:-local-compose-hmac-secret-change-this-value}
      TELEMETRY_TOKEN: ${TELEMETRY_TOKEN:-local-compose-telemetry-service-token}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-demo1234}
      CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-3600000}
      WAF_RULE_DIR: /app/var/waf-rules
      WAF_RELOAD_TIMEOUT_MS: ${WAF_RELOAD_TIMEOUT_MS:-15000}
    volumes:
      - ./waf/rules:/app/var/waf-rules
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:4.25-nginx-lts
    entrypoint: ["/bin/sh", "/opt/siheung/start-with-reloader.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      BACKEND: http://backend:4000
      PORT: 8080
      MODSEC_RULE_ENGINE: "on"
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit/modsec_audit.log
      MODSEC_AUDIT_LOG_PARTS: AIJDEFHZ
      BLOCKING_PARANOIA: 1
      DETECTION_PARANOIA: 1
    ports:
      - "${WAF_PORT:-8080}:8080"
    volumes:
      - ./waf/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
      - ./waf/rules:/opt/siheung/state
      - ./waf/reload-on-change.sh:/opt/siheung/reload-on-change.sh:ro
      - ./waf/start-with-reloader.sh:/opt/siheung/start-with-reloader.sh:ro
      - waf-logs:/var/log
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      TELEMETRY_TOKEN: ${TELEMETRY_TOKEN:-local-compose-telemetry-service-token}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - waf-logs:/var/log/waf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.3.2
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    command:
      [
        "zap.sh",
        "-daemon",
        "-host",
        "0.0.0.0",
        "-port",
        "8080",
        "-config",
        "api.disablekey=false",
        "-config",
        "api.key=${ZAP_API_KEY:-local-zap-api-key-change-this}",
        "-config",
        "api.addrs.addr.name=.*",
        "-config",
        "api.addrs.addr.regex=true",
        "-config",
        "autoupdate.checkOnStart=false",
        "-config",
        "autoupdate.downloadNewRelease=false",
        "-config",
        "autoupdate.installAddonUpdates=false"
      ]
    environment:
      _JAVA_OPTIONS: -Xms256m -Xmx512m
    expose:
      - "8080"
    volumes:
      - zap-data:/home/zap/.ZAP
    depends_on:
      waf:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  waf-logs:
  opensearch-data:
  zap-data:
