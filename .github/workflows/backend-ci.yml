name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "Dockerfile.backend"
      - "compose.yaml"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"
  push:
    paths:
      - "apps/backend/**"
      - "Dockerfile.backend"
      - "compose.yaml"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://siheung:siheung_dev@localhost:5432/siheung?schema=public
      REDIS_URL: redis://localhost:6379
      QUEUE_ENABLED: "true"
      RUN_INTEGRATION_TESTS: "true"
      RUN_QUEUE_INTEGRATION_TESTS: "true"
      AI_PROVIDER: none
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: siheung
          POSTGRES_USER: siheung
          POSTGRES_PASSWORD: siheung_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siheung -d siheung"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @siheung/backend
      - run: npm run prisma:deploy -w @siheung/backend
      - run: npm run typecheck -w @siheung/backend
      - run: npm test -w @siheung/backend
      - run: npm run build -w @siheung/backend
      - run: npx eslint apps/backend
      - run: npm audit --omit=dev -w @siheung/backend
